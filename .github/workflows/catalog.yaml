name: Deploy catalogue

on:
  workflow_dispatch:
  push:
    branches:
      - design
    paths:
      - 'catalog.*'
      - 'src/*.css'
      - '.github/workflows/catalog.yaml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare catalogue
        run: |
          mkdir -p _site/src
          cp catalog.html _site/index.html
          cp catalog.html catalog.css catalog.js _site/
          cp src/*.css _site/src/

      - name: Upload catalogue
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
